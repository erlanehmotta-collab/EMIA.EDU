name: CI/CD Pipeline & Automated Tests - EMIA.EDU

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Linting / Type Check
        run: bunx tsc --noEmit

      - name: Build Frontend & Backend
        run: bun run build

      - name: Smoke Test API Endpoints
        run: |
          echo "Build completed successfully. Validating bundle integrity..."
          test -f dist/index.html && test -f dist/server.cjs
